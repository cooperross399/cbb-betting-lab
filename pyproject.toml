[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbb-betting-lab"
version = "0.1.0"
description = "College Basketball Betting Lab — NCAA Division I men's basketball. Evidence first."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A strict xfail writes an xpass into the junit as a <failure>, which
# scripts/check_test_results.py refuses. Non-strict, an xpass is recorded as a
# plain pass that no reader of the XML can tell from a real one. This sets the
# DEFAULT only: a marker with strict=False overrides it per test.
xfail_strict = true
