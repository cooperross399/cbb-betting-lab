name: Provider Quota

# Free. The `/v4/sports` listing is documented as costing nothing, and it
# returns the headers that answer both "how much is left" and — by watching
# `x-requests-used` fall between readings — "when does the month reset".
#
# The second question matters here more than in the sibling labs: the college
# basketball purchase programme is large enough to span a reset, and a purchase
# that needs most of a month is a plan if the reset day is known and a guess if
# it is not.

on:
  workflow_dispatch:
    inputs:
      list_sports:
        description: "Also record every basketball sport key the provider serves"
        type: boolean
        default: false
  schedule:
    # Daily, so the reset is observed rather than assumed. Costs nothing.
    - cron: "0 6 * * *"

permissions:
  contents: read
  # `actions: read` so this run can DOWNLOAD THE PREVIOUS RUN'S HISTORY, and
  # for no other reason. Deliberately not `contents: write`: GitHub cannot
  # scope write to one ref, so granting it here would add a third holder of
  # write access to `main` — see the write-holder note in
  # `cbb-gameday-refresh.yml`, which `tests/test_workflows.py` pins.
  actions: read

jobs:
  quota:
    name: Provider Quota
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt && python -m pip install -e .
      # THE HISTORY HAD TO BE CARRIED, OR IT WAS NEVER A HISTORY.
      #
      # `check_provider_quota.py` appends to `quota_history.json`, keeps the
      # last 200 entries, and compares each reading against the previous one so
      # that a quota RESET becomes observable — "the reset day becomes
      # observable rather than inferred", in its own words. None of that could
      # ever happen: the file is not tracked, and the runner starts from a clean
      # checkout, so every run appended to an empty list, uploaded a
      # one-entry "history", and was destroyed. Measured 2026-09-16: the
      # artifact of the sixth consecutive daily success held exactly one entry,
      # and the reset branch had never once been reachable.
      #
      # What that cost is not the notice. It is that the lab could not see its
      # own BURN RATE — and the balance does not reset (`docs/credit_cost.md`:
      # "Every credit spent here is spent permanently"), so burn rate is the
      # only thing that answers whether a season's carding fits in what is
      # left. On the day this was found the answer was 4,163 credits of margin.
      #
      # Carried by artifact rather than by commit, so this workflow stays
      # read-only. Absence is fine and expected on the first run.
      - name: Carry the previous history forward
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p data/outputs
          PREVIOUS=$(gh run list --workflow=provider-quota.yml --status=success \
            --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -z "$PREVIOUS" ]; then
            echo "No previous successful run; this history starts here."
            exit 0
          fi
          if gh run download "$PREVIOUS" --name quota --dir data/outputs 2>/dev/null; then
            echo "Carried $(python -c "import json,sys; print(len(json.load(open('data/outputs/quota_history.json'))))" 2>/dev/null || echo '?') entry(ies) forward from run $PREVIOUS."
          else
            # An expired or absent artifact is a gap in the history and not a
            # reason to fail: the reading this run is about to take is still
            # worth recording. It says so rather than starting silently.
            echo "::warning::Run $PREVIOUS has no readable quota artifact (expired?). This history restarts, so the burn rate is unmeasurable until it rebuilds."
          fi

      - name: Check
        env:
          PYTHONPATH: src
          CBB_ODDS_API_KEY: ${{ secrets.CBB_ODDS_API_KEY }}
        run: |
          # `pipefail`: the last command of the pipeline below is `tee`, which
          # succeeds whatever the quota check found, so without it a check
          # that could not reach the provider reported the quota as read.
          set -o pipefail
          if [ -z "${CBB_ODDS_API_KEY}" ]; then
            echo "::error::CBB_ODDS_API_KEY is not set."
            exit 1
          fi
          FLAGS=""
          if [ "${{ inputs.list_sports }}" = "true" ]; then FLAGS="--list-sports"; fi
          python scripts/check_provider_quota.py $FLAGS | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quota
          path: |
            data/outputs/quota_history.json
            data/outputs/provider_sports.json
          if-no-files-found: warn
