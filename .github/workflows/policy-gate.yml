# Policy Gate — the check three documents described and no workflow ran.
#
# `docs/what_we_can_and_cannot_claim.md`, `data/manual/README.md` and
# `src/cbb_betting_lab/reports/what_we_can_claim.py` all said a market joins the
# allowlist "in a pull request whose policy gate is green". Nothing under
# .github/workflows/ opened a receipt. The MECHANISM was there —
# `staging_provider_policy.load()` verifies, for every allowlisted market, a
# receipt that names it, cites an evidence record whose sha256 still matches,
# is signed by somebody who is not Claude, and is dated, and fails the whole
# policy closed otherwise — but it ran when the CARD ran: on a schedule, after
# the merge. A pull request carrying an unreceipted allowlist was green, and
# the sentence in the three documents was true of nothing. This file is that
# sentence's other half.
#
# WHAT IT CHECKS, on every pull request:
#
#   1. `scripts/check_allowlist_receipts.py` calls the same `load()` the card
#      calls, prints the mode it produces, and then verifies EVERY allowlisted
#      entry with `verify_receipt()` one market at a time — including when the
#      file declares `manual_only`, which is the one case `load()` itself skips
#      and the one word an allowlisted-but-unreceipted entry is away from live.
#   2. A receipt whose evidence record is absent, or which no longer hashes to
#      the value the receipt cites, fails there: that is the stale-approval
#      case the checksum exists for and the one the NHL lab's own gate caught.
#   3. On a pull request the policy file at the base commit is read with
#      `git show` and the markets this change ADDS are named in the summary.
#      An added market with no receipt in this same tree is red by (1); this
#      is what makes the summary say which market the change was trying to add.
#
# EXIT 2 IS NOT A PASS. A policy file that exists and cannot be READ — a
# corrupt or truncated one, one whose allowlist is not a list, one whose
# entries are bare strings or name no market, a directory where the file
# belongs, a symlink into nothing — exits 2 and says the gate did not run.
# `load()` answers every one of those with an empty policy, which is the right
# fail-closed answer for the CARD and the wrong report from a gate, because it
# is also what a repository that allowlists nothing looks like. An absent
# policy file, and one that parses and allowlists nothing, stay the ordinary
# green case.
#
# ONE VERDICT, FROM THE EXIT STATUS. The job summary ends with exactly one
# `POLICY GATE VERDICT:` line, built out of the status the checker is about to
# return, and every other line has the verdict wording taken out of it before
# printing. Market names, receipt notes, the `mode` field and the reasons
# `verify_receipt()` gives are text out of files this gate does not control:
# without that, a market NAMED with the sentence a green run prints put a
# green verdict into the summary of a red one, and a reviewer scrolling the
# summary read it. The scrub repeats to a fixed point and checks its own
# output, because one pass in a fixed order rewrote `POLICY GATE: <the green
# sentence>` into `POLICY GATE: [verdict text removed]` and manufactured the
# marker it had been asked to remove. What it cannot see — a misspelling, a
# paraphrase — is written into `without_a_second_verdict`'s docstring and held
# open by a test; neither can spell the marker.
#
# NO CONDITION STANDS BETWEEN A PULL REQUEST AND THIS VERDICT. The job carries
# no `if:`, no `needs:`, no `strategy:` and no `continue-on-error`; no step in
# it carries an `if:` at all; and no other job in this file carries one either.
# GitHub reports a check SKIPPED BY A CONDITION as **Success**, so `if: false`
# on the job, `if: ${{ false }}` on the verifying step, an event test that
# leaves it running only on demand, or a `needs:` pointing at a neighbour that
# skips, would each leave this check green having verified nothing. That is
# the same defect `tests/test_workflows.py` pins on the required `Tests` job,
# and `check_the_policy_gate_runs_unconditionally` now pins it here, with a
# case for every spelling above.
#
# ONE JOB IN THE WHOLE REPOSITORY REPORTS THIS NAME. A check context is a
# job's `name:` and nothing scopes that name to a file, so "exactly one job is
# called `Policy Gate`" is a question about every workflow in
# .github/workflows/ and not about this one. Asked of this file alone — which
# is how it was asked until 2026-09-05 — any other workflow could carry a job
# named `Policy Gate` whose only step is `true`, publish a second and always
# green check under the context five documents here promise, and leave the
# whole suite passing; a reviewer would then read whichever of the two ticks
# they happened to look at. `test_exactly_one_job_in_the_corpus_reports_the_
# policy_gate_check` asks it of the corpus, the way the required `Tests`
# context has always been asked.
#
# ONE AUTHOR FOR THE JOB SUMMARY. `$GITHUB_STEP_SUMMARY` is a per-STEP file
# and GitHub concatenates every step's copy into the one summary a reviewer
# reads, so a second step in THIS job that echoed the green sentence into its
# own copy would put a green verdict above the red one in a failing run —
# where no scrub inside the checker could reach it, because the checker never
# sees that text. It is also a plain environment variable, so a job-level or
# workflow-level `env:` redirects the checker's own write without naming a
# single step: that one does not add a verdict, it sends the only one there
# is to a file nobody opens, and a red gate whose summary is empty told the
# reviewer nothing. So: GITHUB_STEP_SUMMARY is named NOWHERE in the PARSED
# YAML of this file — not in a step, not in a job `env:`, not in a workflow
# `env:` — exactly one step runs the checker, and every other step in the job
# is `actions/checkout` or `actions/setup-python`. The rule reads the loaded
# document and comments are not in it, which is how this paragraph can spell
# the name freely while the workflow proper spells it nowhere: no `run:`, no
# `env:`, no `with:`. The checker reaches the file the way a step is meant
# to, out of its own environment in Python, which is not this file at all.
#
# What that rule does NOT enforce, in its own docstring and held open by a
# test: what those two actions do with the same write handle (their code is
# not in this tree), and a `run:` block inside the checker's own step that
# assembles the variable name rather than spelling it — every OTHER `run:`
# step is refused outright, so that gap is one step wide.
#
# WHAT THE SIGNATURE CHECK IS, EXACTLY. `signed_by` is a string in a JSON
# file. Nothing here is cryptographic and no identity is verified: this gate
# refuses the spellings of Claude it recognises — any value whose letters
# spell `claude`, whatever the case and punctuation — and that is the whole of
# it. Whether the person named actually signed is decided by the human
# reviewing the pull request, and the job summary says so in those words
# rather than claiming an enforcement this check does not have.
#
# NO paths: FILTER, deliberately. The natural spelling of "on every pull
# request touching data/manual/staging_provider_policy.json" is a `paths:`
# filter, and tests/test_workflows.py::check_no_trigger_is_path_filtered
# refuses one for every workflow in this repository: a path-filtered check
# stays PENDING rather than passing on the pull requests it filters out, and
# the change that defeats a guard rarely touches the guard's own file. So this
# runs on every pull request and verifies the receipts every time, which is
# strictly more than the sentence asked for.
#
# LEAST PRIVILEGE. `contents: read`, no secret in any spelling, no credential,
# nothing installed from the network beyond the interpreter, and no `pip
# install` at all: `staging_provider_policy` and `competitions` are standard
# library only, so `PYTHONPATH=src` is the whole setup. The gate reads. It
# writes no policy, no receipt and no evidence, and there is still no
# `grant()` for it to call.
#
# THIS CHECK IS NOT REQUIRED BY BRANCH PROTECTION. Measured 2026-09-05 by
# another session with `gh api repos/cooperross399/cbb-betting-lab/branches/
# main/protection` and recorded in tests/test_workflows.py: main's
# `required_status_checks.contexts` is exactly `["Tests"]`. So a red
# `Policy Gate` is a fact in the pull request and not a hold on the merge
# button, exactly as a red `Ledger Guard` is. Adding this context to
# protection is a repository setting and a human's to make; nothing in this
# repository may grant itself one.

name: Policy Gate

on:
  # Every pull request, and every push, and on demand. No paths: filter and no
  # branches: filter, for the reason in the header.
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-gate-${{ github.ref }}
  # A superseded pull-request run is re-done in full by the next one, so
  # cancelling it loses nothing. A push run is the only run that will ever look
  # at that commit, so it is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  receipts:
    name: Policy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          # The base commit's policy file is read with `git show`, so the base
          # has to be in the clone.
          fetch-depth: 0
          # This job reads. A token left in .git/config is blast radius.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify every allowlisted market against a receipt a person signed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # A base ref that cannot be resolved is a HARD STOP, not a pass: "the
        # base allowlisted nothing" and "I could not read the base" must never
        # take the same branch. On a push or a dispatch there is no base and
        # none is invented; the receipt verification is what makes the gate red
        # and it does not need one.
        run: |
          set -euo pipefail
          BASE=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            BASE="${PR_BASE_SHA}"
            if [ -z "${BASE}" ]; then
              echo "::error::A pull_request run with no base commit. The policy gate did not compare the allowlist against the base, and this is a broken gate, NOT evidence that the allowlist is receipted."
              exit 1
            fi
            if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              echo "::error::Cannot resolve the base commit ${BASE}. The policy gate did not compare the allowlist against the base, and this is a broken gate, NOT evidence that the allowlist is receipted."
              exit 1
            fi
          fi
          PYTHONPATH=src python scripts/check_allowlist_receipts.py --base-ref "${BASE}"
