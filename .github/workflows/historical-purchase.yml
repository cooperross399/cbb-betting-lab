name: Historical Purchase

# SPENDS A LARGE FRACTION OF A FINITE BALANCE. Manual dispatch only, one wave
# per dispatch, and there is no cron on this file — a discipline test enforces
# that. A recurring purchase is a standing order to spend money.
#
# The waves, in the brief's priority order:
#   1. core_team          moneyline, spread, total, team total — six seasons
#   2. ladders_and_halves alternate rungs and the halves — three seasons
#   3. props              player props — three seasons
#   4. futures            blocked; see the wave's own reason
#
# Every season of a wave is bought before any of the next, so a purchase that
# runs out of credits holds the family it is most sure of across every season
# rather than a little of everything.
#
# THE CAP IS ENFORCED AGAINST THE MEASURED RUNNING TOTAL from `x-requests-last`,
# never against the estimate. The NHL lab capped a run at 200,000 and it spent
# 289,984, because the estimate counted markets asked for while the provider
# bills per market returned — and both the code and its test asserted the cap
# "cannot be breached".
#
# RESUMING COSTS NOTHING. Every response is cached raw and keyed by event and
# market-chunk fingerprint, so an interrupted purchase resumes rather than
# restarts. The cache is uploaded as an artifact on every run, including a
# failed one — at ten times the live rate, losing a bought response is the most
# expensive mistake available here.

on:
  workflow_dispatch:
    inputs:
      waves:
        description: "Wave to buy (one per dispatch)"
        type: choice
        options: [core_team, ladders_and_halves, props]
        default: core_team
      credit_cap:
        description: "Hard cap, checked against the measured running total"
        type: string
        default: "1300000"
      window:
        description: "card = T-60m (what a card could take). close = T-10m (CLV only)."
        type: choice
        options: [card, close]
        default: card
      max_events_per_segment:
        description: "0 = no limit. Use to buy a deliberate sample."
        type: string
        default: "0"
      merge_artifact_runs:
        description: "Space-separated run ids whose raw-response artifacts are merged into the cache before the rebuild. For a lineage the cache chain never restored."
        type: string
        default: ""
      live:
        description: "Actually spend credits. Unchecked = dry run."
        type: boolean
        default: false

permissions:
  contents: read

env:
  # 2019 and 2020 are fetched but NOT purchased. The conference-tier table
  # is built walk-forward from seasons strictly earlier than the one being
  # priced — tiering off the season under purchase would leak its own result
  # into the stratum every game lands in — so the earliest priced season
  # (2021, the first with featured-market history) needs seasons behind it.
  PURCHASE_SEASONS: "2019 2020 2021 2022 2023 2024 2025 2026"

jobs:
  buy:
    name: Historical Purchase
    runs-on: ubuntu-latest
    # GITHUB CAPS A JOB AT 360 MINUTES and applies the cap silently to any
    # larger value, so the 1440 this line used to declare was never honoured:
    # every run of this workflow was going to be killed at six hours whatever
    # the YAML said. The purchase is budgeted in credits, not minutes — the cap
    # is checked against the measured running total before every request and
    # every response is cached raw as it arrives — so a wave that outlives the
    # job is finished by dispatching it again, which resumes from the cache and
    # re-buys nothing. `docs/credit_cost.md` says the same, and
    # `tests/test_workflows.py` refuses a timeout above the cap in any job.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt && python -m pip install -e .

      - name: Restore the feed and table cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/cbb
            data/processed
          key: cbb-data-v1-${{ env.PURCHASE_SEASONS }}-${{ hashFiles('src/cbb_betting_lab/data/**') }}
          restore-keys: cbb-data-v1-

      - name: Fetch the feeds and build the tables
        env:
          PYTHONPATH: src
        run: |
          set -eu
          python scripts/fetch_cbb_data.py --seasons $PURCHASE_SEASONS
          python scripts/build_datasets.py --seasons $PURCHASE_SEASONS

      # The bought responses, restored from the previous run of the same wave
      # and window. This is what makes a purchase resumable.
      # THE PATH HERE WAS WRONG AND COST 1.3M CREDITS OF PERSISTENCE.
      # `historical.cache_dir_for` returns
      # `data/raw/cbb/historical_purchase/<window>`, not
      # `data/raw/cbb/historical_<window>`. The old path matched nothing, so
      # this cache saved nothing, the resume never resumed, and the artifact
      # step below uploaded nothing. The responses survived only because the
      # sibling `cbb-data-v1` cache happens to cover the whole of
      # `data/raw/cbb`. Derived from the module now, never spelled by hand.
      # THE RESTORE IS NOT SCOPED TO THIS RUN'S WAVE, AND MUST NOT BE. The
      # first version restored `cbb-bought-<window>-<wave>-` first, which HIT
      # for a wave bought before and shadowed the any-wave fallback — so a
      # rebuild dispatched as core_team restored only core_team's responses,
      # rebuilt "all waves" from a disk that held one, and reported 2,946,929
      # rows while the props cache held the complete surviving set. Defect U's
      # fix (`--waves all` in the rebuild) was defeated one layer up.
      #
      # Now the key is unique per run (always a miss, so the post-step always
      # SAVES) and the only restore key is the any-wave prefix, which
      # actions/cache resolves to the MOST RECENTLY CREATED match — i.e. the
      # last run of any wave, whose cache already accumulated every run before
      # it. Every run therefore starts from the whole surviving set and adds
      # its own. The early artifact upload after Buy is the 90-day backup for
      # the day this cache is evicted.
      - name: Restore the bought responses
        uses: actions/cache@v4
        with:
          path: data/raw/cbb/historical_purchase/${{ inputs.window }}
          key: cbb-bought-${{ inputs.window }}-${{ github.run_id }}
          restore-keys: |
            cbb-bought-${{ inputs.window }}-

      # DID THE RESPONSES SURVIVE? The first purchase persisted them only by
      # accident, inside the sibling `data/raw/cbb` cache. This step answers
      # "is the cache empty or did staging fail" before anything else runs,
      # because those are different faults with the same symptom.
      # A LINEAGE THE CACHE CHAIN NEVER RESTORED CAN BE MERGED FROM ITS ARTIFACT.
      # The any-wave restore key resolves to ONE cache — the latest — and a run
      # that saved before another run started is a separate lineage the chain
      # never sees again: the 609-event ladders run (33902269994) survived only
      # in its own cache and its 90-day artifact while every later run
      # restored the props lineage. Naming that run here downloads its raw
      # responses on top of the restored cache, so this run's post-save holds
      # the union and every later run inherits it. Filenames are event+chunk
      # fingerprints, so a collision is the same response twice.
      - name: Merge prior runs' raw-response artifacts into the cache
        if: inputs.merge_artifact_runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.merge_artifact_runs }}
          DEST: data/raw/cbb/historical_purchase/${{ inputs.window }}
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          for run_id in $RUNS; do
            tmp=$(mktemp -d)
            # Every raw-cache artifact of that run, whatever wave named it.
            gh run download "$run_id" -R "${{ github.repository }}" -p 'historical-cache-*' -D "$tmp"
            # upload-artifact strips the common ancestor: each artifact's root
            # IS the card/ directory's contents.
            n=0
            for root in "$tmp"/*/; do
              [ -d "$root" ] || continue
              cp -Rn "$root". "$DEST"/
              n=$((n + $(find "$root" -name '*.json' | wc -l)))
            done
            echo "merged $n responses from run $run_id"
            rm -rf "$tmp"
          done
          echo "cache now holds $(find "$DEST" -name '*.json' | wc -l) responses; slate listings: $(ls "$DEST/slates" 2>/dev/null | wc -l)"

      - name: What is actually in the response cache
        run: |
          DIR="data/raw/cbb/historical_purchase/${{ inputs.window }}"
          echo "## Response cache" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$DIR" ]; then
            N=$(find "$DIR" -type f -name '*.json' | wc -l)
            SZ=$(du -sh "$DIR" | cut -f1)
            echo "\`$DIR\`: **$N cached responses**, $SZ" | tee -a "$GITHUB_STEP_SUMMARY"
            find "$DIR" -type f -name '*.json' | head -3
          else
            echo "\`$DIR\` **does not exist**. Nothing was restored." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Present under data/raw/cbb:"; ls -la data/raw/cbb 2>/dev/null || echo "  (data/raw/cbb absent)"
          fi

      - name: Quota before
        env:
          PYTHONPATH: src
          CBB_ODDS_API_KEY: ${{ secrets.CBB_ODDS_API_KEY }}
        run: python scripts/check_provider_quota.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Buy
        env:
          PYTHONPATH: src
          CBB_ODDS_API_KEY: ${{ secrets.CBB_ODDS_API_KEY }}
        run: |
          set -o pipefail
          FLAGS="--waves ${{ inputs.waves }}"
          FLAGS="$FLAGS --credit-cap ${{ inputs.credit_cap }}"
          FLAGS="$FLAGS --window ${{ inputs.window }}"
          FLAGS="$FLAGS --max-events-per-segment ${{ inputs.max_events_per_segment }}"
          if [ "${{ inputs.live }}" = "true" ]; then
            if [ -z "${CBB_ODDS_API_KEY}" ]; then
              echo "::error::CBB_ODDS_API_KEY is not set; a live purchase cannot run."
              exit 1
            fi
            FLAGS="$FLAGS --live"
          fi
          python scripts/buy_historical_prices.py $FLAGS | tee -a "$GITHUB_STEP_SUMMARY"

      # THE EXPENSIVE THING IS PERSISTED FIRST. Run 33917619764 spent 1,199,926
      # credits, then the store rebuild below was OOM-killed on a 7GB runner
      # ("The operation was canceled"), and every step after it — this upload
      # and both cache saves — was skipped. Nothing from that run was saved
      # anywhere. The raw responses are the purchase; the store is derived
      # from them for free. So the responses go up the moment Buy returns,
      # before anything that can die touches them.
      - name: Upload the raw bought responses (before anything can die)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-cache-${{ inputs.waves }}-${{ inputs.window }}
          path: data/raw/cbb/historical_purchase/${{ inputs.window }}/**
          if-no-files-found: warn
          retention-days: 90

      # THE LIVE BUY DOES NOT WRITE THE STORE. It caches every raw response and
      # counts the rows it staged, but the processed CSV is derived data built
      # by `--rebuild`, which makes no request and costs nothing. Without this
      # step a completed purchase leaves 1.8M staged rows reported in the
      # summary and no store on disk — which is exactly what the first run did.
      #
      # `if: always()`, because a run that hit its cap raises after buying, and
      # the responses it bought before raising are worth just as much.
      - name: Build the store from the cached responses
        if: always()
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          # ALL waves, FROM SCRATCH. A rebuild scoped to this run's wave appended
          # onto whatever stale store the cache happened to restore, which is how
          # the store "shrank" from 2.9M rows to 2.3M when props were bought: the
          # completion seasons and the ladders were never in the restored copy.
          # The raw cache holds every wave; the store is rebuilt from all of it,
          # one segment at a time so a large wave cannot exhaust memory.
          python scripts/buy_historical_prices.py \
            --waves all \
            --window ${{ inputs.window }} \
            --max-events-per-segment ${{ inputs.max_events_per_segment }} \
            --rebuild | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la data/processed/ | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Quota after
        if: always()
        env:
          PYTHONPATH: src
          CBB_ODDS_API_KEY: ${{ secrets.CBB_ODDS_API_KEY }}
        run: python scripts/check_provider_quota.py | tee -a "$GITHUB_STEP_SUMMARY"

      # The price store and the raw cache are the bought goods. Both are
      # uploaded even when a step failed: a purchase that spent a million
      # credits and then died staging them must not lose what it bought.
      - name: Upload the store, the record and the cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-${{ inputs.waves }}-${{ inputs.window }}
          path: |
            data/processed/cbb_historical_prices_*.csv
            data/outputs/cbb_historical_purchase.*
            data/outputs/quota_history.json
          if-no-files-found: warn
          retention-days: 90

