# Ledger Guard — the append-only rule, checked at the diff instead of at runtime.
#
# `ExperimentLedger.save()` in src/cbb_betting_lab/experiment_ledger.py refuses
# to shrink a ledger. This header used to add that "until 2026-09-04 it could
# not see even those", and to quote a reproduction — twelve of thirty
# hypotheses deleted, the recorder re-run, the correction falling from x1.60 to
# x1.46. Both halves were re-measured and both were wrong; this file was the
# fourth carrier of them and the one the correcting commit missed.
#
#   - The old re-read DOES fire on an in-process shrink. Load the tracked
#     ledger, delete entries in memory, save back to the same path, and it
#     raises. `tests/test_check_ledger_append_only.py` runs that comparison
#     against `save()` as it stood on 02e75b7 rather than describing it.
#   - The recorder self-heals. `record()` puts every hypothesis in HYPOTHESES
#     back, so the correction returns to what it was instead of falling.
#
# What no runtime guard reaches is a ledger edited ON DISK AND COMMITTED:
# `save()` is never called on that path, so nothing compares anything, and
# every report from then on reads the shorter file and quotes the smaller
# correction. This workflow is that layer. It compares the ledger on the head
# against the ledger at the base of the PR, keyed on
# (search, name, seasons, stage), and refuses a run in which a recorded
# hypothesis was removed, re-dated, re-directed, or had a measured outcome
# rewritten. The runtime guard now also takes the count the caller loaded as an
# explicit floor — the one number a re-read cannot reconstruct when the target
# path does not yet hold the ledger.
#
# ONE ledger is diffed, and the loop below has exactly one entry:
# data/outputs/experiment_ledger.json. A second tracked copy under
# data/outputs/holdout/ was where the replication appended its holdout looks
# while the backtest read its correction from this one — two files, and the
# correction understated by the holdout's looks. #11 removed the copy. One
# cumulative count, because one ledger. The tracked render,
# data/outputs/cbb_experiment_ledger.md, is NOT compared key by key; it is
# covered by the re-render step below, which rebuilds it from the .json and
# demands no diff.
#
# This workflow READS. It holds `contents: read`, and tests/test_workflows.py
# refuses the write permission to any workflow absent from its WRITERS map,
# which this one is; it reaches the `secrets` context nowhere, which that file
# refuses too. A base ref it cannot resolve is a HARD STOP, not a pass:
# "there was no prior ledger" and "I could not read the prior ledger" must
# never take the same branch. Every run block here is executed under stubs by
# the linter and must exit non-zero when any command in it fails.
#
# THIS CHECK IS NOT REQUIRED BY BRANCH PROTECTION. Measured 2026-09-05 with
# `gh api repos/cooperross399/cbb-betting-lab/branches/main/protection`: the
# only context main requires is `Tests`. A red `Ledger Guard` is a fact in the
# pull request, not a block on the merge button, and that gap is written into
# tests/test_workflows.py::test_the_disclosed_holes_are_real rather than
# claimed shut.

name: Ledger Guard

on:
  # No paths: filter (a filtered required check hangs pending), and no
  # branches: filter (a ledger edited on a side branch reaches main through a
  # merge, and the check has to run BEFORE the merge). The first push of a new
  # branch carries an all-zeros `before`; #9 made that fall back to origin/main
  # rather than exit 1, because a guard that is red on every new branch is a
  # guard people learn to ignore.
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger-guard-${{ github.ref }}
  # A PR run compares the whole head against the base, so a superseded one is
  # re-done in full. A PUSH run compares exactly one range and is never
  # cancelled: cancel it and that range is never compared by anything.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  append_only:
    name: Ledger Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Resolve the base commit, or stop
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request) BASE="${PR_BASE_SHA}" ;;
            push)
              # A branch's FIRST push carries an all-zeros `before`: there is
              # no previous tip to compare against. That used to exit 1 here,
              # so every new branch opened with this check red and the PR run
              # green — and a guard that is red on every first push is a guard
              # people learn to ignore. For a new branch the ledger's true base
              # is main: every commit on the branch is after it by definition.
              if [ "${PUSH_BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
                git fetch --no-tags --depth=1 origin main >/dev/null 2>&1 || { echo "::error::Could not fetch origin/main to serve as the base for a first push. The append-only check did not run."; exit 1; }
                BASE="origin/main"
                echo "First push of a new branch: comparing against origin/main."
              else
                BASE="${PUSH_BEFORE_SHA}"
              fi
              ;;
            workflow_dispatch) BASE="origin/main" ;;
            *)
              echo "::error::Unhandled event ${EVENT_NAME}. The append-only check did not run. This is a broken guard, NOT evidence that the ledger is intact."
              exit 1
              ;;
          esac
          if [ -z "${BASE}" ]; then
            echo "::error::No base ref for event ${EVENT_NAME}. The append-only check did not run."
            exit 1
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::Cannot resolve the base commit ${BASE}. The append-only check did not run. This is a broken guard, NOT evidence that the ledger is intact."
            exit 1
          fi
          echo "sha=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Base commit: ${BASE}"

      - name: Refuse a removed or rewritten hypothesis
        env:
          BASE: ${{ steps.base.outputs.sha }}
        # The comparison lives in scripts/check_ledger_append_only.py, with
        # its cases in tests/test_check_ledger_append_only.py. There is no
        # allowlist, no --force and no env-var waiver. Temp-then-move on the
        # extract: `git show REF:file > file` creates the target even when it
        # fails, and a zero-byte ledger must not read as zero hypotheses.
        run: |
          set -euo pipefail
          if [ ! -f scripts/check_ledger_append_only.py ]; then
            echo "::error::scripts/check_ledger_append_only.py is missing. The append-only check did not run."
            exit 1
          fi
          if ! git ls-tree "${BASE}" -- data/outputs/ >/dev/null; then
            echo "::error::Cannot read the base tree at ${BASE}. The append-only check did not run."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/ledger-check"
          : > "${RUNNER_TEMP}/ledger-check/summary.txt"
          for LEDGER in data/outputs/experiment_ledger.json; do
            SLUG="$(printf '%s' "${LEDGER}" | tr '/' '_')"
            if git cat-file -e "${BASE}:${LEDGER}" 2>/dev/null; then
              TMP="$(mktemp)"
              git show "${BASE}:${LEDGER}" > "${TMP}"
              if [ ! -s "${TMP}" ]; then
                rm -f "${TMP}"
                echo "::error::The base ledger ${LEDGER} exists but came back empty."
                exit 1
              fi
              mv "${TMP}" "${RUNNER_TEMP}/ledger-check/base_${SLUG}"
              echo "Base ledger ${LEDGER} extracted from ${BASE}."
              python scripts/check_ledger_append_only.py --base "${RUNNER_TEMP}/ledger-check/base_${SLUG}" --head "${LEDGER}" | tee "${RUNNER_TEMP}/ledger-check/check_${SLUG}.txt"
            else
              echo "No ledger at ${LEDGER} in the base commit ${BASE}. First-commit state."
              python scripts/check_ledger_append_only.py --base-absent --head "${LEDGER}" | tee "${RUNNER_TEMP}/ledger-check/check_${SLUG}.txt"
            fi
            SUMMARY_LINE="$(head -n 1 "${RUNNER_TEMP}/ledger-check/check_${SLUG}.txt")"
            [ -n "${SUMMARY_LINE}" ] || { echo "::error::The append-only check left no output for ${LEDGER}."; exit 1; }
            echo "${LEDGER}: ${SUMMARY_LINE}" >> "${RUNNER_TEMP}/ledger-check/summary.txt"
          done

      - name: Re-render the discovery ledger from source and demand no diff
        # Runs the recorder, which now passes save() the count it loaded as a
        # floor, and proves the tracked .md is the render of the tracked .json.
        # Tracked-ness is asserted BEFORE the render, while a deletion is still
        # visible: `git diff` is blind to an untracked file the render recreates.
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- data/outputs/experiment_ledger.json data/outputs/cbb_experiment_ledger.md >/dev/null || { echo '::error::A tracked ledger file was deleted. The ledger is append-only; removing the render removes the record.'; exit 1; }
          PYTHONPATH=src python scripts/record_experiments.py
          git diff --exit-code -- data/outputs/experiment_ledger.json data/outputs/cbb_experiment_ledger.md
          test -z "$(git status --porcelain -- data/outputs/)" || { git status --porcelain -- data/outputs/; echo '::error::The ledger render left untracked output.'; exit 1; }

      - name: Summarise
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          SUMMARY="$(cat "${RUNNER_TEMP}/ledger-check/summary.txt")"
          [ -n "${SUMMARY}" ] || { echo '::error::The append-only check left no summary. Nothing was compared.'; exit 1; }
          printf 'Ledger Guard against base %s\n%s\n' "${BASE}" "${SUMMARY}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the ledger that was compared
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-check
          path: |
            ${{ runner.temp }}/ledger-check/
            data/outputs/experiment_ledger.json
          if-no-files-found: error
