name: Tests

# Every push and every pull request. Nothing merges with this red — that rule
# lives in CLAUDE.md, and this workflow is what makes it enforceable rather
# than aspirational.
#
# No secret is available to this workflow, deliberately. The suite must pass
# without a credential, which is what proves nothing here quietly depends on a
# live provider — and what lets a run on a fork be trusted.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The secrets guard runs `git ls-files`, so it needs a real
          # repository rather than an export.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src scripts

      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      # The cost arithmetic and the probe's dry run both read the cached
      # hoopR schedules, which are gitignored (460MB) and absent here.
      # Fetching them in CI would put an external release host on the critical
      # path of a gate that must stay green for reasons internal to this
      # repository. Both are exercised in the workflows that hold the cache.
      #
      # What matters about the dry run — that it opens no socket and reads no
      # credential — is proved by `tests/test_the_dry_run_is_dry.py`, which is
      # stronger than grepping its last line and needs no cache.
